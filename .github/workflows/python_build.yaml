on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.14"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --locked

    - name: Linting
      run: |
        uv run ruff check .

    - name: Unit tests
      run: |
        uv run pytest -v -s --cov --cov-report=term-missing

  buildx:
    needs: pytest
    if: startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          # Same Dockerfile/image content, two entrypoints (pyproject
          # [project.scripts]): `core-sim` runs the server, `core-sim-relay`
          # runs the outbox relay. Publishing them as separate packages keeps
          # their tag/version history (and cleanup) independent.
          - name: server
            suffix: ""
            command: core-sim
          - name: relay
            suffix: "-relay"
            command: core-sim-relay

    steps:
    - uses: actions/checkout@v7

    - name: set image metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
        tags: |
          type=ref,event=tag
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss' tz='Asia/Singapore'}}-{{sha}},enable=${{ github.ref == 'refs/heads/main' }}
        flavor: |
          latest=false
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up docker buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        provenance: false
        platforms: "linux/amd64,linux/arm64"
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          APP_CMD=${{ matrix.command }}

  clean-up:
    needs: buildx
    runs-on: ubuntu-latest
    permissions:
      packages: write

    strategy:
      matrix:
        suffix: ["", "-relay"]

    steps:
    - name: Delete old images
      uses: actions/delete-package-versions@v5
      with:
        owner: ${{ github.repository_owner }}
        package-name: ${{ github.event.repository.name }}${{ matrix.suffix }}
        package-type: container
        min-versions-to-keep: 5
        ignore-versions: latest
        token: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
