on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        python-version:
          - "3.14"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --locked --extra postgres

    - name: Linting
      run: |
        uv run ruff check .

    - name: Unit tests
      id: unit_tests
      run: |
        uv run pytest -v -s --cov --cov-report=html

        if [[ -f "htmlcov/index.html" ]]; then
          echo "coverage_report=yes" >> $GITHUB_OUTPUT
        fi

    - name: Upload test coverage report to GitHub pages
      if: steps.unit_tests.outputs.coverage_report == 'yes'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: htmlcov
      continue-on-error: true

  buildx:
    needs: pytest
    if: startsWith(github.ref, 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7

    - name: set image metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=tag
          type=raw,value=main-{{date 'YYYYMMDD-HHmmss' tz='Asia/Singapore'}}-{{sha}},enable=${{ github.ref == 'refs/heads/main' }}
        flavor: |
          latest=false
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up docker buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        provenance: false
        platforms: "linux/amd64,linux/arm64"
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  clean-up:
    needs: buildx
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
    - name: Delete old images
      uses: actions/delete-package-versions@v5
      with:
        owner: ${{ github.repository_owner }}
        package-name: ${{ github.event.repository.name }}
        package-type: container
        min-versions-to-keep: 5
        ignore-versions: latest
        token: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
